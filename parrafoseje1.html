<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de Orden de Párrafos</title>
    <style>
        /* Fondo animado */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contenedor para el fondo animado */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #2196f3, #f44336, #ffeb3b);
            background-size: 600% 600%;
            z-index: -1;
            animation: gradientAnimation 10s ease infinite;
        }

        /* Animación del fondo */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Contenedor principal */
        .content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Barra de progreso y puntuación */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

        #progressBar {
            flex-grow: 1;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            background-color: #4caf50;
            width: 0;
            transition: width 0.3s;
        }

        /* Botón de intentar nuevamente */
        #retryButton {
            padding: 8px 15px;
            background-color: #ff7043;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #retryButton:hover {
            background-color: #e64a19;
        }

        /* Zona de arrastre y zona de destino */
        .exercise-section {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }

        .dropzone, .opciones {
            background-color: #f0f4f8;
            border: 2px dashed #90caf9;
            padding: 10px;
            border-radius: 8px;
            min-width: 320px;
            min-height: 350px;
            overflow-y: auto;
        }

        /* Párrafos arrastrables */
        .draggable {
            width: 100%;
            padding: 15px;
            margin: 5px 0;
            background-color: #e3f2fd;
            border: 2px solid #90caf9;
            border-radius: 8px;
            cursor: grab;
            transition: background-color 0.3s ease;
        }

        /* Mensajes de retroalimentación */
        #successMessage, #errorMessage, #errorExplanation {
            font-size: 1rem;
            animation: fade-in 0.5s ease;
        }

        #successMessage {
            color: #4caf50;
        }

        #errorMessage {
            color: #ff7043;
            background-color: #ffe0b2;
            padding: 8px;
            border-radius: 5px;
            animation: shake 0.5s ease;
        }

        #errorExplanation {
            color: #ff7043;
            font-size: 0.9rem;
            margin-top: 5px;
            text-align: center;
        }

        /* Animaciones */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <div class="status-bar">
            <div id="progressBar">
                <div id="progress"></div>
            </div>
            <button id="retryButton" onclick="retryExercise()">Intentar Nuevamente</button>
        </div>

        <h2>Ordena los párrafos para pasar al siguiente ejercicio</h2>

        <div class="exercise-section">
            <div class="opciones" id="opciones"></div>
            <div class="dropzone" id="zonaDestino"></div>
        </div>

        <!-- Mensajes de retroalimentación -->
        <div id="successMessage">¡Lo lograste! Pasando al siguiente ejercicio...</div>
        <div id="errorMessage">Incorrecto, intenta de nuevo.</div>
        <div id="errorExplanation"></div>
        <div>Puntos: <span id="score">0</span> | Tiempo: <span id="time">0</span> segundos</div>

        <!-- Sonidos de retroalimentación -->
        <audio id="correctSound" src="correct.mp3"></audio>
        <audio id="incorrectSound" src="incorrect.mp3"></audio>
    </div>

    <script>
        const exercises = [
            [
                { text: "Los juegos serios están diseñados con fines educativos o de entrenamiento, no solo como entretenimiento.", order: 1 },
                { text: "Estos juegos utilizan técnicas lúdicas para motivar y mejorar el aprendizaje en áreas específicas.", order: 2 },
                { text: "A diferencia de los videojuegos comunes, tienen objetivos claros de aprendizaje y evaluación.", order: 3 },
                { text: "Por ejemplo, se utilizan en la medicina para simular procedimientos y en la educación para enseñar conceptos complejos.", order: 4 }
            ],
            [
                { text: "Los juegos serios pueden mejorar habilidades prácticas y de resolución de problemas.", order: 1 },
                { text: "En educación, estos juegos ofrecen un entorno seguro donde los estudiantes pueden cometer errores sin consecuencias reales.", order: 2 },
                { text: "También se usan en entrenamiento profesional, como la capacitación de pilotos y militares.", order: 3 },
                { text: "Estos juegos ayudan a desarrollar habilidades críticas mediante experiencias simuladas.", order: 4 }
            ],
            [
                { text: "En el ámbito de la salud, los juegos serios son útiles para la rehabilitación de pacientes.", order: 1 },
                { text: "Mediante juegos diseñados específicamente, los pacientes pueden mejorar sus habilidades motoras y cognitivas.", order: 2 },
                { text: "También ayudan a reducir la ansiedad y motivar a los pacientes en su proceso de recuperación.", order: 3 },
                { text: "Este enfoque permite una recuperación más interactiva y atractiva.", order: 4 }
            ],
            [
                { text: "Los juegos serios en el ámbito empresarial ayudan a mejorar habilidades de liderazgo y trabajo en equipo.", order: 1 },
                { text: "Simulaciones empresariales permiten a los empleados practicar toma de decisiones en entornos simulados.", order: 2 },
                { text: "Estas simulaciones fomentan un pensamiento crítico y preparan a los empleados para situaciones reales.", order: 3 },
                { text: "Además, motivan a los empleados mediante una experiencia inmersiva y educativa.", order: 4 }
            ]
        ];

        const explanations = [
            "Recuerda que el primer párrafo introduce el propósito general del juego serio, seguido por ejemplos específicos.",
            "Asegúrate de que el primer párrafo introduzca el beneficio de los juegos serios en habilidades prácticas.",
            "El orden correcto presenta primero el uso general en rehabilitación y luego profundiza en cómo beneficia al paciente.",
            "El primer párrafo debe presentar la aplicación general en el ámbito empresarial antes de los detalles específicos."
        ];

        let currentExercise = 0;
        let score = 0;
        let startTime = 0;

        const opcionesDiv = document.getElementById('opciones');
        const dropzone = document.getElementById('zonaDestino');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorExplanation = document.getElementById('errorExplanation');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const progress = document.getElementById('progress');
        const correctSound = document.getElementById("correctSound");
        const incorrectSound = document.getElementById("incorrectSound");

        function loadExercise() {
            opcionesDiv.innerHTML = '';
            dropzone.innerHTML = '';
            successMessage.style.display = 'none';
            errorMessage.style.display = 'none';
            errorExplanation.style.display = 'none';
            startTime = new Date().getTime();

            exercises[currentExercise].forEach(paragraph => {
                const paraDiv = document.createElement('div');
                paraDiv.className = 'draggable';
                paraDiv.draggable = true;
                paraDiv.textContent = paragraph.text;
                paraDiv.dataset.order = paragraph.order;
                opcionesDiv.appendChild(paraDiv);

                paraDiv.addEventListener('dragstart', () => paraDiv.classList.add('dragging'));
                paraDiv.addEventListener('dragend', () => paraDiv.classList.remove('dragging'));
            });
        }

        dropzone.addEventListener('dragover', e => e.preventDefault());
        dropzone.addEventListener('drop', () => {
            const dragging = document.querySelector('.dragging');
            if (dragging) {
                dropzone.appendChild(dragging);
                checkOrder();
            }
        });

        function checkOrder() {
            const items = Array.from(dropzone.children);
            const correctOrder = items.every((item, index) => item.dataset.order == index + 1);

            if (items.length === exercises[currentExercise].length) {
                if (correctOrder) {
                    items.forEach(item => item.style.backgroundColor = '#c8e6c9');
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    errorExplanation.style.display = 'none';
                    score++;
                    scoreDisplay.textContent = score;
                    correctSound.play();
                    const endTime = new Date().getTime();
                    const timeTaken = ((endTime - startTime) / 1000).toFixed(2);
                    timeDisplay.textContent = timeTaken;
                    progress.style.width = ((currentExercise + 1) / exercises.length) * 100 + "%";
                    setTimeout(nextExercise, 2000);
                } else {
                    items.forEach(item => item.style.backgroundColor = '#ffe0b2');
                    successMessage.style.display = 'none';
                    errorMessage.style.display = 'block';
                    errorExplanation.style.display = 'block';
                    errorExplanation.textContent = explanations[currentExercise];
                    incorrectSound.play();
                }
            }
        }

        function retryExercise() {
            loadExercise(); // Recarga el ejercicio actual sin cambiar de ejercicio
        }

        function nextExercise() {
            currentExercise++;
            if (currentExercise < exercises.length) {
                loadExercise();
            } else {
                alert(`¡Felicidades! Completaste todos los ejercicios con un total de ${score} puntos y un tiempo total de ${timeDisplay.textContent} segundos.`);
            }
        }

        loadExercise();
    </script>
</body>
</html>
